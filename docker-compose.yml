services:
  postgres:
    image: postgres:17
    container_name: matrixflow-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-matrixflow}
      POSTGRES_USER: ${POSTGRES_USER:-matrixflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-matrixflow_local}

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - matrixflow_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-matrixflow} -d ${POSTGRES_DB:-matrixflow}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  matrixflow_postgres_data: